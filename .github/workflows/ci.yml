name: CI

# PR-gated only: nothing runs after a merge (owner decision 2).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # No version input: pnpm/action-setup reads the packageManager pin in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      # Cheapest gate first.
      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      # dist/ is committed; the build must reproduce it byte for byte.
      - name: dist/ drift gate
        run: git diff --exit-code -- dist/

      # The root .claude/ copy is generated by the CLI from template/. So is
      # docs/guides/agent-workflow.md -- a managed payload file update rewrites at the
      # root, which is why the pathspec is not .claude/ alone. Re-running update must
      # change nothing -- neither a tracked file (template ahead) nor an untracked *.new
      # (a hand edit to the generated copy). The rest of docs/ is out: docs/history/ and
      # docs/plans/ are this repo's own records and legitimately differ from the
      # payload's scaffolding.
      - name: Generated copy drift gate
        shell: bash
        run: |
          node dist/cli.js update .
          status="$(git status --porcelain --untracked-files=all -- .claude/ docs/guides/)"
          if [ -n "$status" ]; then printf '%s\n' "$status"; exit 1; fi

      - name: Self-test (must print 62/62)
        run: pnpm selftest

      - name: CLI smoke (init + doctor)
        shell: bash
        run: |
          SMOKE="$RUNNER_TEMP/cl-workflow-smoke"
          rm -rf "$SMOKE"
          mkdir -p "$SMOKE"
          node dist/cli.js init "$SMOKE"
          node dist/cli.js doctor "$SMOKE"

  # The single check name required by the live ruleset main-pr-gate (id 21458765).
  # The job id and this name must both stay exactly `ci-ok`.
  ci-ok:
    name: ci-ok
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every matrix leg passed
        run: |
          echo "test result: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ]
