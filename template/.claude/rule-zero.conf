# .claude/rule-zero.conf — read by .claude/hooks/rule-zero.ts on every Bash / Edit / Write call.
#
# One rule per line:  <verb> <extended regex>   (JavaScript RegExp, compiled without the u
#                                                flag; searched, not anchored — existing
#                                                patterns keep their meaning)
# Matched against each Bash command segment (split on && || ; | newline), or against
# "path:outside-repo <resolved path>" for file-editing tools.
#
#   deny   never by an agent, grant or not — the owner runs it by hand
#   allow  short-circuit: a standing approval or a known-safe shape
#   guard  rule zero — orchestrator needs a single-use grant; sub-agents are always denied
#
# Precedence: deny > allow > guard, regardless of line order. No match → silent, normal flow.
#
# KEEP THIS TIGHT. The kit is permissive on purpose. A false positive costs the owner a
# question, and that is the failure mode that gets the kit thrown away. When in doubt, leave
# a shape out and rely on the agent being well behaved.

## Never — catastrophic; no grant is honoured
deny  rm -[a-zA-Z]*r[a-zA-Z]* +(/|~|\$HOME)/?( |$)
deny  git push .*(--force|-f |--force-with-lease).*\b(main|master)\b
deny  git push --mirror

## Standing approvals — the process itself says yes to these (guide §5, §8–§10)
allow ^git (add|commit|status|diff|log|show|fetch|pull|switch|checkout -b|merge|tag|worktree (add|list|prune))\b
allow ^git branch -d worktree-
allow ^git worktree remove [^-]
allow ^git restore --staged
allow ^gh (pr (create|view|list|comment|checks|diff|status)|issue (create|view|list|comment)|label (list|create)|run (list|view|watch|cancel)|api [^-]*$)
allow (curl|wget|xh|http|https) .*(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|host\.docker\.internal|\.local\b)

## Rule zero — discards work, or changes state outside the repo
guard git push .*(--force|-f |--force-with-lease|--delete|-d |:refs/| :[A-Za-z])
guard git branch .*(-D|--delete|-d )
guard git reset --hard
guard git checkout (-- |\.( |$))
guard git restore\b
guard git clean -[a-zA-Z]*f
guard git stash (drop|clear)
guard git worktree remove.*(--force|-f\b)
guard ^gh (pr (merge|close|edit --base)|issue (close|delete)|repo (delete|archive|edit)|release (create|delete)|secret|variable)
guard ^gh api .*(-X|--method) *(POST|PUT|PATCH|DELETE)
guard ^gh api .*(-f |-F |--field|--raw-field|--input)
guard (curl|wget|xh) .*(-X|--request) *(POST|PUT|PATCH|DELETE)
guard (curl|wget|xh) .*(-d |--data|-F |--form|-T |--upload-file|--json)
guard ^http(s)? +(POST|PUT|PATCH|DELETE)
guard (dropdb|DROP (DATABASE|TABLE|SCHEMA))
guard docker (volume (rm|prune)|system prune|compose down .*-v)
guard ^path:outside-repo

